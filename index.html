<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Juliet 💕</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: linear-gradient(135deg,#ff9ecf,#ffcce6);
  font-family: 'Segoe UI', sans-serif;
  overflow:hidden;
}

.card{
  background:white;
  padding:40px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 15px 35px rgba(0,0,0,0.2);
  position:relative;
  z-index:2;
}

h1{ color:#ff4d88; }

button{
  padding:12px 25px;
  border:none;
  border-radius:25px;
  font-size:16px;
  cursor:pointer;
  margin:10px;
  transition:0.3s;
}

#yes{
  background:#ff4d88;
  color:white;
}

#no{
  background:#555;
  color:white;
  position:absolute;
}

.hearts{
  position:fixed;
  font-size:20px;
  animation: float 4s linear infinite;
}

@keyframes float{
  0%{transform:translateY(100vh);}
  100%{transform:translateY(-10vh);}
}

#photoContainer{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  justify-content:center;
  align-items:center;
  flex-direction:column;
  animation:fadeIn 1s ease forwards;
  z-index:5;
}

#photoContainer img{
  width:300px;
  border-radius:20px;
  box-shadow:0 0 40px #ff4d88;
  animation:zoomIn 1s ease forwards;
}

#photoContainer h2{
  color:white;
  margin-top:20px;
}

@keyframes zoomIn{
  from{transform:scale(0.5);opacity:0;}
  to{transform:scale(1);opacity:1;}
}

@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}

#countdown{
  font-size:18px;
  color:#ff4d88;
  margin-bottom:10px;
}
</style>
</head>

<body>

<audio id="music">
  <source src="cuando.m4a" type="audio/mp4">
<audio>

<div class="card">
  <h1>Juliet 💕</h1>
  <div id="countdown"></div>
  <h2>¿Quieres ser mi San Valentín? 💖</h2>
  <button id="yes">Sí 💘</button>
  <button id="no">No 😅</button>
</div>

<div id="photoContainer">
  <img src="IMG_0147.jpeg">
  <h2>Desde hoy somos oficialmente nosotros 💞✨</h2>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const photoContainer = document.getElementById("photoContainer");
let yesSize = 16;

// Botón No huye
noBtn.addEventListener("mouseover", function(){
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 50);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";

  yesSize += 5;
  yesBtn.style.fontSize = yesSize + "px";
});

// Cuando dice Sí
yesBtn.addEventListener("click", function(){
  photoContainer.style.display="flex";

  const music = document.getElementById("music");
  music.volume = 0;
  music.play();

  let fade = setInterval(function(){
    if(music.volume < 1){
      music.volume += 0.05;
    } else {
      clearInterval(fade);
    }
  }, 200);
});

// Corazones
function createHeart(){
  const heart = document.createElement("div");
  heart.classList.add("hearts");
  heart.innerHTML="💗";
  heart.style.left=Math.random()*100+"vw";
  heart.style.animationDuration=(Math.random()*3+2)+"s";
  document.body.appendChild(heart);
  setTimeout(()=>{heart.remove()},4000);
}
setInterval(createHeart,300);

// Contador 12 horas
let time = 43200;
const countdown = document.getElementById("countdown");

setInterval(()=>{
  let hours = Math.floor(time/3600);
  let minutes = Math.floor((time%3600)/60);
  let seconds = time%60;
  countdown.innerHTML = "Tienes " + hours+"h "+minutes+"m "+seconds+"s para decidir ⏳";
  time--;
},1000);
</script>

</body>
</html>
